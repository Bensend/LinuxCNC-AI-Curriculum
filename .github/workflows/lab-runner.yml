name: LinuxCNC Lab Runner

# MANUAL-ONLY local compute. Never use GitHub-hosted runners.
# The self-hosted label is NOT proof of disconnected machinery.
on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "Explicit reviewed lab-jobs/*.sh path (no default smoke)"
        required: true
        type: string
      job_sha256:
        description: "SHA-256 of the reviewed job script contents"
        required: true
        type: string
      disconnected_simulation_verified:
        description: "Qualified operator verified the local runner cannot actuate machinery"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize this workflow's local jobs; does not serialize other runner workflows.
concurrency:
  group: linuxcnc-local-lab
  cancel-in-progress: false

jobs:
  run-lab-job:
    runs-on: [self-hosted, openpressbrake]
    if: ${{ inputs.disconnected_simulation_verified }}
    timeout-minutes: 75

    steps:
      - name: Check out curriculum repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate explicit lab job and local isolation attestation
        id: select
        shell: bash
        env:
          JOB_FILE: ${{ inputs.job_file }}
          EXPECTED_SHA256: ${{ inputs.job_sha256 }}
          ISOLATION_ATTESTED: ${{ inputs.disconnected_simulation_verified }}
        run: |
          set -euo pipefail
          if [[ "$ISOLATION_ATTESTED" != "true" ]]; then
            echo "No qualified disconnected-simulation attestation; refusing." >&2
            exit 10
          fi
          # Fail closed: only reviewed pure-software state fixtures are permitted.
          # Historical lab-jobs include sudo/build and LinuxCNC loadrt paths.
          # Any new hardware-capable job requires a separately reviewed workflow
          # change AND qualified physical isolation outside GitHub.
          case "$JOB_FILE" in
            lab-jobs/086-pb-dxf-002-human-confirmation-recipe.sh|\
            lab-jobs/087-pb-dxf-003-gaugeplan-provenance.sh|\
            lab-jobs/088-pb-dxf-004-targetset-provenance.sh|\
            lab-jobs/089-pb-bg-004-targetset-runtime-episode.sh) ;;
            *) echo "Job is not on the reviewed pure-software allowlist." >&2; exit 3 ;;
          esac
          if [[ ! -f "$JOB_FILE" || -L "$JOB_FILE" ]]; then
            echo "Job missing or symlink; refusing." >&2; exit 2
          fi
          # This is only a path check. It does NOT prove the PC is physically isolated.
          root="$(realpath lab-jobs)"
          target="$(realpath "$JOB_FILE")"
          case "$target" in "$root"/*.sh) ;; *) echo "Path escapes lab-jobs." >&2; exit 4 ;; esac
          if [[ ! "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "Missing or malformed reviewed SHA-256." >&2
            exit 5
          fi
          actual="$(sha256sum "$JOB_FILE" | cut -d' ' -f1)"
          if [[ "${actual,,}" != "${EXPECTED_SHA256,,}" ]]; then
            echo "Job content differs from reviewed SHA-256; refusing." >&2
            exit 6
          fi
          echo "job_file=$JOB_FILE" >> "$GITHUB_OUTPUT"
          echo "job_name=$(basename "$JOB_FILE" .sh)" >> "$GITHUB_OUTPUT"

      - name: Run lab job and capture complete output
        id: runjob
        shell: bash
        run: |
          set +e
          mkdir -p lab-results
          rm -f lab-results/LATEST.md lab-results/LATEST.stdout.log lab-results/LATEST.stderr.log lab-results/LATEST.metadata.txt lab-results/LATEST.exit_code.txt
          JOB_FILE="${{ steps.select.outputs.job_file }}"
          JOB_NAME="${{ steps.select.outputs.job_name }}"
          RUN_DIR="lab-results/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          {
            echo "LinuxCNC AI Curriculum Lab"
            echo "UTC start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repository commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "Job file: $JOB_FILE"
            echo "Runner: $(uname -a)"
            echo "Inner lab timeout: 70 minutes (job ceiling: 75 minutes)"
            echo
          } > "$RUN_DIR/metadata.txt"
          timeout --signal=TERM --kill-after=15s 70m bash "$JOB_FILE" > "$RUN_DIR/stdout.log" 2> "$RUN_DIR/stderr.log"
          STATUS=$?
          echo "$STATUS" > "$RUN_DIR/exit_code.txt"
          echo "UTC finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RUN_DIR/metadata.txt"
          cat "$RUN_DIR/stdout.log"
          if [[ -s "$RUN_DIR/stderr.log" ]]; then echo "--- STDERR ---" >&2; cat "$RUN_DIR/stderr.log" >&2; fi
          {
            echo "# Latest LinuxCNC Lab Result"
            echo
            echo "- Job: \`$JOB_NAME\`"
            echo "- Job file: \`$JOB_FILE\`"
            echo "- Workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Exit code: \`$STATUS\`"
            echo "- Finished UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
            echo "## Metadata"; echo '```text'; cat "$RUN_DIR/metadata.txt"; echo '```'
            echo; echo "## Standard output"; echo '```text'; cat "$RUN_DIR/stdout.log"; echo '```'
            echo; echo "## Standard error"; echo '```text'; cat "$RUN_DIR/stderr.log"; echo '```'
          } > lab-results/LATEST.md
          cp "$RUN_DIR/stdout.log" lab-results/LATEST.stdout.log
          cp "$RUN_DIR/stderr.log" lab-results/LATEST.stderr.log
          cp "$RUN_DIR/metadata.txt" lab-results/LATEST.metadata.txt
          cp "$RUN_DIR/exit_code.txt" lab-results/LATEST.exit_code.txt
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish result as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linuxcnc-lab-${{ steps.select.outputs.job_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab-results/run-${{ github.run_id }}-${{ github.run_attempt }}
            lab-results/LATEST.md
            lab-results/LATEST.stdout.log
            lab-results/LATEST.stderr.log
            lab-results/LATEST.metadata.txt
            lab-results/LATEST.exit_code.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write GitHub job summary
        if: always()
        shell: bash
        run: |
          if [[ -f lab-results/LATEST.md ]]; then cat lab-results/LATEST.md >> "$GITHUB_STEP_SUMMARY"; else echo "Lab runner ended before producing a fresh LATEST result; checked-out LATEST files were removed before execution." >> "$GITHUB_STEP_SUMMARY"; fi

      # Results remain in the workflow artifact. A separate reviewed GitHub
      # commit is required for durable curriculum evidence; the physical
      # panel-PC runner does not receive a repository write token.

      - name: Fail workflow if lab job failed
        if: always()
        shell: bash
        run: |
          STATUS="$(cat lab-results/LATEST.exit_code.txt 2>/dev/null || echo 99)"
          if [[ "$STATUS" != "0" ]]; then echo "Lab job failed with exit code $STATUS" >&2; exit "$STATUS"; fi
