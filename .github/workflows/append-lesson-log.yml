name: Append Lesson Log

on:
  push:
    branches: [main]
    paths:
      - "TIMING_APPEND_REQUEST.txt"
      - "timing-queue/**"

permissions:
  contents: write

concurrency:
  group: append-lesson-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: [self-hosted, openpressbrake]
    timeout-minutes: 5
    steps:
      - name: Check out complete curriculum repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 reviewed tag 2026-10-28
        with:
          fetch-depth: 0

      - name: Validate immutable requests, append idempotently, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "linuxcnc-curriculum-log-bot"
          git config user.email "linuxcnc-curriculum-log-bot@users.noreply.github.com"

          # Every attempt starts from a complete, freshly fetched main tree.
          # Queue files are immutable; no request slot is overwritten or cleared.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            test -s LESSON_LOG.md

            requests=()
            if [[ -f TIMING_APPEND_REQUEST.txt ]]; then
              requests+=("TIMING_APPEND_REQUEST.txt")
            fi
            if [[ -d timing-queue ]]; then
              while IFS= read -r -d '' file; do
                requests+=("$file")
              done < <(find timing-queue -maxdepth 1 -type f -name '*.row' -print0 | sort -z)
            fi

            changed=0
            for file in "${requests[@]}"; do
              # Read the whole request; reject multiline or malformed entries.
              row="$(cat "$file")"
              if [[ "$row" != '| '* || "$row" != *' |' || "$row" == *$'\n'* ]]; then
                echo "Malformed timing request: $file" >&2
                exit 2
              fi
              # 8 table fields, 9 pipe delimiters, matching LESSON_LOG schema.
              if [[ "$(printf '%s' "$row" | tr -cd '|' | wc -c)" -ne 9 ]]; then
                echo "Unexpected column count in $file" >&2
                exit 3
              fi
              if ! grep -Fqx -- "$row" LESSON_LOG.md; then
                printf '%s\n' "$row" >> LESSON_LOG.md
                changed=1
              fi
            done

            if [[ "$changed" -eq 0 ]]; then
              echo "All pending timing rows already present."
              exit 0
            fi

            git add LESSON_LOG.md
            git commit -m "log: append pending curriculum session timing [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying full safe append ($attempt/5)." >&2
            sleep 1
          done
          echo "Safe append failed after retries; requests retained unchanged." >&2
          exit 4
