name: Append S03 Session Timing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/append-s03-session-timing.yml"

permissions:
  contents: write

jobs:
  append-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append timing row and self-delete
        shell: bash
        run: |
          set -euo pipefail
          START='2026-09-07T08:14:49.552388Z'
          PREV_END='2026-09-07T07:21:22.358430Z'
          END="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
          read -r ELAPSED GAP <<<"$(python3 - "$START" "$END" "$PREV_END" <<'PY'
          import sys
          from datetime import datetime
          p=lambda s: datetime.fromisoformat(s.replace('Z','+00:00'))
          start,end,prev=map(p,sys.argv[1:4])
          print(f'{(end-start).total_seconds()/60:.1f} {(start-prev).total_seconds()/60:.2f}')
          PY
          )"
          ROW="| 2026-09-07 | S03 mutable-IOPort LLIO implementation + lab 013 launch | $START | $END | $ELAPSED | EXPERIMENT | Inspect workflow \`34099929612\` and its own artifact/exit code; registration/baseline failure = HARNESS INVALID; if Gates A-D pass, commit accepted result, run stale-feedback/recovery adversarial exam, fresh-AI handoff, and counterfactual promotion test | No overlap; previous lesson ended $PREV_END, about ${GAP} minutes before this session began. Implemented one-IOPort mutable LLIO with exact \`io_error\` control and write capture; workflow still running at checkpoint, so no runtime result claimed. |"
          if ! grep -Fq 'S03 mutable-IOPort LLIO implementation + lab 013 launch' LESSON_LOG.md; then
            printf '\n%s\n' "$ROW" >> LESSON_LOG.md
          fi
          rm -f .github/workflows/append-s03-session-timing.yml
          git config user.name 'linuxcnc-curriculum-agent'
          git config user.email 'linuxcnc-curriculum-agent@users.noreply.github.com'
          git add LESSON_LOG.md .github/workflows/append-s03-session-timing.yml
          git commit -m 'log: S03 mutable LLIO lab-launch session timing'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "SESSION_END=$END"
          echo "ELAPSED_MIN=$ELAPSED"
          echo "PREVIOUS_GAP_MIN=$GAP"
